[package]
name = "opendrobo-desktop"
version = "0.2.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
opendrobo-core = { path = "../../crates/opendrobo-core" }
tauri = { version = "2.12.4", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "=0.42.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
